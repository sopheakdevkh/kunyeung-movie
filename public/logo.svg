<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%" role="img" aria-label="Kun Yeung Emblem">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE066" />
      <stop offset="50%" stop-color="#FFB800" />
      <stop offset="100%" stop-color="#E59400" />
    </linearGradient>
    <linearGradient id="filmGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFC72C" />
      <stop offset="100%" stop-color="#D48806" />
    </linearGradient>
  </defs>

  <!-- Dark Rounded Base -->
  <rect x="6" y="6" width="88" height="88" rx="20" fill="#0C0D12" stroke="#FFB800" stroke-width="2" stroke-opacity="0.3" />

  <!-- Clapper Body (Gold) -->
  <rect x="25" y="32" width="50" height="42" rx="6" fill="url(#goldGrad)" />

  <!-- Play Button (Black) -->
  <polygon points="44,43 44,63 60,53" fill="#0C0D12" />

  <!-- Top Clapper Stick (Slanted) -->
  <g transform="rotate(-8 25 32)">
    <rect x="22" y="18" width="54" height="12" rx="3" fill="#1A1C24" />
    <!-- Slanted Yellow Stripes -->
    <path d="M 28 18 L 34 18 L 29 30 L 23 30 Z" fill="url(#goldGrad)" />
    <path d="M 40 18 L 46 18 L 41 30 L 35 30 Z" fill="url(#goldGrad)" />
    <path d="M 52 18 L 58 18 L 53 30 L 47 30 Z" fill="url(#goldGrad)" />
    <path d="M 64 18 L 70 18 L 65 30 L 59 30 Z" fill="url(#goldGrad)" />
    <!-- Hinge -->
    <circle cx="27" cy="24" r="3.5" fill="#E59400" stroke="#0C0D12" stroke-width="1.5" />
  </g>

  <!-- Filmstrip ribbon wrapping around bottom -->
  <path d="M 18 52 C 16 68, 28 80, 50 82 C 72 84, 84 72, 82 56" fill="none" stroke="url(#filmGrad)" stroke-width="7" stroke-linecap="round" />
  <!-- Film Sprocket Holes -->
  <circle cx="23" cy="62" r="1.2" fill="#0C0D12" />
  <circle cx="31" cy="73" r="1.2" fill="#0C0D12" />
  <circle cx="43" cy="79" r="1.2" fill="#0C0D12" />
  <circle cx="57" cy="80" r="1.2" fill="#0C0D12" />
  <circle cx="69" cy="74" r="1.2" fill="#0C0D12" />
  <circle cx="78" cy="64" r="1.2" fill="#0C0D12" />
</svg>
